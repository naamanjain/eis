blank_issues_enabled: true
contact_links:
  - name: Report a security issue privately
    url: https://github.com/naamanjain/eis/security/advisories/new
    about: >-
      Never open a public issue for a credential leak or an exploitable flaw.
      Report privately so a fix can exist before the details are public.
  - name: Development guide
    url: https://github.com/naamanjain/eis/blob/main/docs/DEVELOPMENT.md
