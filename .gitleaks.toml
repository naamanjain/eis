# Scanner guidance for Gitleaks (https://github.com/gitleaks/gitleaks) — not a switch that turns
# detection off. The default ruleset stays in force; this file narrows exactly one known false
# positive so a real finding cannot hide inside it.
#
# Run it with:  npm run scan:secrets
title = "Explain It Simply — Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
# src/shared/ORIGIN.json is written by `npm run vendor` and shipped inside the .vsix. It maps each
# vendored core file to its SHA-256, so every value in it is a 64-character content digest. The
# generic-api-key rule reads a line such as "providers/keyPool.js": "<64 hex>" as
# `key … : "<secret>"` and reports it.
#
# Why this one path, and nothing else:
#   - The allowance is one filename, matched only when its parent directory is `src/shared`.
#   - No regex blanket is used, so a real key in any other file — or a non-digest value here —
#     is still reported.
#   - Two gate checks enforce that shape: `node scripts/check.js` fails unless ORIGIN.json parses
#     to exactly {source, count, files → 64-hex digests}, and fails if this file's allowlist grows
#     beyond that path. `npm run verify:package` additionally requires every digest in it to hash
#     true against the file it names. So there is nothing this can hide.
description = "vendored-core provenance digests in src/shared/ORIGIN.json are content hashes, not credentials"
paths = ['''src/shared/ORIGIN\.json$''']
